[package]
name = "molt-parakeet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Molt plugin: on-device speech-to-text, NVIDIA Parakeet TDT 0.6B v3 on sherpa-onnx"
repository = "https://github.com/moltcode/molt-parakeet"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
